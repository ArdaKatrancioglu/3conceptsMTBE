server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /concept-2 {
        return 301 /concept-2/;
    }

    location = /concept-3 {
        return 301 /concept-3/;
    }

    location ^~ /concept-3/ {
        try_files $uri $uri/ /concept-3/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
