services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - concepts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - concepts

networks:
  concepts:
    driver: bridge
